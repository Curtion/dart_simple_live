name: Build Linux

on:
  workflow_call:
    inputs:
      app_dir:
        required: true
        type: string
      flutter_version:
        required: false
        type: string
        default: "3.38.5"
      release:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Build Version
        id: version
        run: |
          echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "number=${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          cd ${{ inputs.app_dir }}
          version=${{ steps.version.outputs.name }}
          # 去掉版本号中的 v 前缀
          version=${version#v}
          build_number=${{ steps.version.outputs.number }}
          sed -i "s/^version:.*/version: ${version}+${build_number}/" pubspec.yaml
          echo "Updated pubspec.yaml version to ${version}+${build_number}"
          head -5 pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Restore Packages
        run: |
          cd ${{ inputs.app_dir }}
          flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Linux
        run: |
          cd ${{ inputs.app_dir }}
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ${{ inputs.app_dir }}/build/dist/*/*.deb
            ${{ inputs.app_dir }}/build/dist/*/*.zip

      - name: Upload Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ inputs.app_dir }}/build/dist/*/*.deb
            ${{ inputs.app_dir }}/build/dist/*/*.zip
