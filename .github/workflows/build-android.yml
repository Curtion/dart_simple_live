name: Build Android

on:
  workflow_call:
    inputs:
      app_dir:
        required: true
        type: string
      flutter_version:
        required: false
        type: string
        default: "3.38.5"
      java_version:
        required: false
        type: string
        default: "17"
      release:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
    secrets:
      keystore_base64:
        required: true
      store_password:
        required: true
      key_password:
        required: true
      key_alias:
        required: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Build Version
        id: version
        run: |
          echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "number=$((${{ github.run_id }} % 2100000000))" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml version
        run: |
          cd ${{ inputs.app_dir }}
          version=${{ steps.version.outputs.name }}
          # 去掉版本号中的 v 前缀
          version=${version#v}
          build_number=${{ steps.version.outputs.number }}
          sed -i '' "s/^version:.*/version: ${version}+${build_number}/" pubspec.yaml
          echo "Updated pubspec.yaml version to ${version}+${build_number}"
          head -5 pubspec.yaml

      - name: Download Keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.keystore_base64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > ${{ inputs.app_dir }}/android/key.properties
          echo "storePassword=${{ secrets.store_password }}" >> ${{ inputs.app_dir }}/android/key.properties
          echo "keyPassword=${{ secrets.key_password }}" >> ${{ inputs.app_dir }}/android/key.properties
          echo "keyAlias=${{ secrets.key_alias }}" >> ${{ inputs.app_dir }}/android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Restore Packages
        run: |
          cd ${{ inputs.app_dir }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ inputs.app_dir }}
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.number }} \
            --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-x86_64-release.apk
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ inputs.app_dir }}/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
